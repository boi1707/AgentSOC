name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check src scripts tests integrations
      - run: python -m ruff format --check src scripts tests integrations
      - run: python -m pytest -q
      - run: python -m scripts.replay
      - run: bash -n scripts/setup.sh scripts/send_test_alert.sh scripts/check_leaks.sh
  container:
    name: Isolated Python 3.12 image and rollback gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - name: Build one versioned image for backend and worker
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "agentsoc:ci-$GITHUB_SHA" .
      - name: Build historical rollback image from committed baseline only
        run: |
          mkdir -p "$RUNNER_TEMP/agentsoc-previous"
          git archive 0022d28 | tar -x -C "$RUNNER_TEMP/agentsoc-previous"
          docker build -t agentsoc:rollback-0022d28 "$RUNNER_TEMP/agentsoc-previous"
      - name: Validate isolated runtime, dry-run, migration and image rollback
        run: >-
          python -m scripts.validate_docker
          --image "agentsoc:ci-$GITHUB_SHA"
          --previous-image agentsoc:rollback-0022d28
          --report "$RUNNER_TEMP/agentsoc-docker-validation.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-validation-result
          path: ${{ runner.temp }}/agentsoc-docker-validation.json
          if-no-files-found: warn
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.lock
      - run: npm ci && npm run typecheck && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
