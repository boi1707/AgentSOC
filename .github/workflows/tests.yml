name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python -m pytest -q
      - run: python -m scripts.replay
      - run: bash -n scripts/setup.sh scripts/send_test_alert.sh scripts/check_leaks.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          template = Path('.env.example').read_text()
          template = template.replace('INGEST_KEY=\n', 'INGEST_KEY=' + secrets.token_urlsafe(32) + '\n')
          template = template.replace('APPROVE_KEY=\n', 'APPROVE_KEY=' + secrets.token_urlsafe(32) + '\n')
          Path('.env').write_text(template)
          PY
          mkdir -p data
          sudo chown 10001:10001 data
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: make health && make replay
      - run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T agentsoc-backend python -c "import sqlite3; db=sqlite3.connect('data/agentsoc.db'); assert db.execute(\"select count(*) from cases where status='pending'\").fetchone()[0] == 1; assert db.execute('select count(*) from ledger').fetchone()[0] == 3"; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          make leaks
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
